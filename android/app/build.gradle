plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.phongtrl.mousejig'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.phongtrl.mousejig'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    sourceSets.main.assets.srcDirs = [rootProject.file('../app')]
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
