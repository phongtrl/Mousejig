name: Build mobile apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Mousejig-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone
        run: |
          xcodebuild -project ios/Mousejig.xcodeproj -scheme Mousejig -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/iphone" CODE_SIGNING_ALLOWED=NO build
          test -s "$RUNNER_TEMP/iphone/Build/Products/Release-iphoneos/Mousejig.app/app/index.html"
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/Mousejig.xcodeproj -scheme Mousejig -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/simulator" build
          ditto -c -k --keepParent "$RUNNER_TEMP/simulator/Build/Products/Debug-iphonesimulator/Mousejig.app" Mousejig-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mousejig-iOS-Simulator
          path: Mousejig-Simulator.zip
          if-no-files-found: error
